name: 综测雷达

on:
  schedule:
    # GitHub 的定时任务在整点/半点等高峰时段可能延迟或被丢弃，所以避开这些时刻，并加一次补跑。
    # 已发过的通知会记录在 state/，补跑不会重复发。
    - cron: "23 0 * * *"   # 北京时间 08:23
    - cron: "53 3 * * *"   # 北京时间 11:53（补跑）
  workflow_dispatch:         # 允许在 Actions 页面手动点"Run workflow"
  push:                      # 改了代码或配置后自动跑一次，方便检验
    branches: [main]
    paths: ["monitor.py", "config.yaml", ".github/workflows/monitor.yml"]

permissions:
  contents: write            # 需要把 state/ 的更新提交回仓库

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并发送邮件
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py

      - name: 保存已读状态
        if: always()
        run: |
          git config user.name "zongce-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新已读状态 $(date -u +%F)"
          git push

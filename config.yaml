# ---------------------------------------------------------------
# 二、加分类别与关键词（按顺序匹配，第一个命中的作为主类别）
#     hint 会原样写进邮件，提醒这类通知对应综测哪一项、大约多少分
#     （括号内为硕士乘系数后的分值）
# ---------------------------------------------------------------
categories:
  - id: A-project
    name: 科研课题申报
    hint: A项·课题主持：省部级20分(≈10)，校级10分(≈5)；中央高校基金按省部级算
    keywords: [科研创新项目, 创新项目, 创新基金, 科研项目, 项目申报, 基本科研业务费, 研究生科研, 课题申报, 自主选题]
  - id: C-honor
    name: 评优表彰
    hint: C项·思想品德奖励分：校党委/校行政表彰15分(≈4.5)，校职能部门或学院表彰3分（累计≤9）
    keywords: [三好, 优秀研究生, 优秀毕业研究生, 优秀共青团员, 优秀团干部, 优秀学生干部, 优秀志愿者, 先进个人, 先进集体, 学生先进, 五四, 评优, 表彰, 红旗团支部]
  - id: D-volunteer
    name: 志愿服务/社会实践
    hint: D项·志愿服务>10天4-6分、≤10天1-3分(×0.3)；国奖要求硕士≥10天社会实践或志愿
    keywords: [志愿, 社会实践, 三下乡, 支教, 服务团, 挂职, 挂（兼）职, 挂(兼)职, 暑期实践, 寒假实践, 实践团, 调研]
  - id: DE-contest
    name: 竞赛
    hint: D/E项·获奖：国家级第1名15、省级12、校级9(×0.3)；学科竞赛2人按7:3、3人按6:3:1分
    keywords: [竞赛, 大赛, 挑战杯, 互联网+, 建模, 演讲比赛, 比赛, 选拔赛, 专项赛, 挑战赛, 知识竞答]
  - id: A-conf
    name: 学术会议
    hint: A项·学术交流：国际会议分会场报告20(≈10)/poster 5(≈2.5)；全国会议8(≈4)/2(≈1)；要邀请函、议程、摘要集
    keywords: [学术年会, 学术会议, 研讨会, 学术论坛, 青年论坛, 会议通知, 征稿, 年会, 学术大会, 研究生论坛]
  - id: A-award
    name: 优秀论文/征文
    hint: A项·科研获奖：校院征文按校级科研获奖计（一等第1名10分）；全国性学会优秀论文10分
    keywords: [优秀论文, 论文评选, 征文, 成果奖, 学术成果评比]
  - id: E-sports
    name: 文体活动
    hint: E项·文体获奖分值同竞赛表；校级参与0.5分
    keywords: [运动会, 歌唱, 合唱, 文艺, 书法, 摄影, 马拉松, 篮球, 足球, 羽毛球, 乒乓球, 舞蹈, 朗诵, 主持人]
  - id: F-work
    name: 学生干部/社会工作
    hint: F项·社会工作：院研会主席/班长/支书6-9，班委/部门负责人/助管3-6；任职须满一学期
    keywords: [研究生会, 兼职团干部, 兼职辅导员, 学生干部, 助管, 换届, 竞选, 招募]
  - id: Z-scholar
    name: 奖助学金（不加分，可额外申请）
    hint: 不计入综测，但社会/专项奖助学金可以额外申请
    keywords: [奖学金, 助学金, 奖助]

# 标题含这些词的一律忽略
exclude: [招聘, 采购, 招标, 职称, 专业技术职务, 博士后, 出国（境）, 出国(境), 教职工, 离退休, 合格评估, 缴纳会费, 标准的公告, 征求意见,
          培训班, 图像采集, 火车票, 选课, 开课, 招生, 管理办法, 教育工作者, 学生工作先进, 教学改革, 党建引领, 承办单位,
          年度报告, 暂停举办, 师范生]

# 标题含这些词的打上 ⭐ 并排在同类最前面（和你的方向/地域相关）
focus_words: [地理信息, 地信, GIS, 遥感, 测绘, 地图, 北斗, 地学计算, 地理模型, 三维, 智慧城市, 人工智能, 大数据,
              研究生, 青年, 西南地区, 国际, 挑战杯]

# 标题含"本科"但不含"研究生"的忽略
skip_undergrad_only: true

# 标题含这些词的视为"结果公示"，放在邮件末尾，了解进度即可
result_words: [公示, 名单, 结果, 获奖情况, 的决定]

# ---------------------------------------------------------------
# 三、运行参数
# ---------------------------------------------------------------
lookback_days: 21          # 只推送最近多少天内发布的新通知
max_detail_fetch: 15       # 每次最多打开多少篇正文去找截止日期

# ---------------------------------------------------------------
# 四、固定提醒（按往年惯例设置，日期以官网为准，可自行增删）
#     date 为每年提醒的月-日；当天及之后14天内的第一次运行会推送一次
# ---------------------------------------------------------------
reminders:
  - date: "11-20"
    text: "EGU 欧洲地球科学联合会大会（次年4月，维也纳）摘要截止通常在1月中旬，如有可投成果可与导师商量。"
  - date: "12-10"
    text: "IGARSS（IEEE 国际地球科学与遥感大会，每年7月）投稿截止通常在1月中旬，地信/遥感方向的主力国际会议。"
  - date: "03-01"
    text: "春季学期开学：留意研究生院的重庆市研究生科研创新项目申报通知（省部级课题主持≈10分）和五四评优。"
  - date: "06-20"
    text: "AGU 美国地球物理学会年会（12月）摘要截止通常在7月底/8月初。暑期社会实践报名也集中在这段时间（志愿≥10天对国奖有用）。"
  - date: "08-01"
    text: "综测前一个月：确认论文录用通知/见刊情况，录用未见刊要准备《论文录用证明承诺书》；整理各项证明材料。"
